<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA de Conteúdo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Descubra quais formatos de conteúdo combinam com você.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0a0a0a; --cream:#fffaf3; --papel:#f7f2ea; --papel2:#efe7da;
  --red:#ff0101; --red-dp:#c40000;
  --dim:#cfc9c0; --gray:#8a8278; --gray-c:#b5aca0; --dark:#332f29;
  --linha:#e4ddd2; --fio:#efe9df;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);
     color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
     overflow-x:hidden;max-width:100vw}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;
       background:none}
input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
em{font-style:normal;color:var(--red)}

/* topo */
.topo{background:var(--ink);color:var(--cream);padding:14px 20px;display:flex;
      align-items:center;gap:10px}
.mk{position:relative;width:24px;height:14px;flex:none}
.mk i{position:absolute;top:0;width:14px;height:14px;border-radius:50%;background:var(--red)}
.mk i:first-child{left:0}
.mk i:last-child{left:10px;box-shadow:-2px 0 0 0 var(--ink)}
.topo span{font-family:'Sora';font-weight:700;font-size:11px;letter-spacing:.22em;
           text-transform:uppercase}

/* progresso */
.prog{height:3px;background:var(--papel2);position:sticky;top:0;z-index:10}
.prog span{display:block;height:100%;background:var(--red);transition:width .3s ease}

/* telas */
.tela{max-width:620px;margin:0 auto;padding:48px 22px 70px}
.tela.larga{max-width:820px}
h1{font-family:'Sora';font-weight:800;font-size:clamp(31px,5.5vw,46px);line-height:1.04;
   letter-spacing:-.035em;margin-bottom:18px;text-wrap:balance}
h2{font-family:'Sora';font-weight:700;font-size:clamp(21px,3.4vw,27px);line-height:1.22;
   letter-spacing:-.026em;margin-bottom:26px;text-wrap:balance}
h3{font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:-.022em}
.lead{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:19px;line-height:1.5;
      color:var(--dark);margin-bottom:26px}
.sub{color:var(--gray);font-size:14.5px;margin:-14px 0 26px}
.selo{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);
      font-weight:700;margin-bottom:16px}
.contador{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);
          font-weight:700;margin-bottom:14px}
.contador s{color:var(--gray-c);text-decoration:none}
.mini{font-size:12.5px;color:var(--gray);margin-top:14px;text-align:center}

.aviso{background:var(--papel);border-left:2px solid var(--red);padding:15px 18px;
       font-size:14.5px;line-height:1.55;color:var(--dark);margin-bottom:30px}
.aviso b{font-weight:600;color:var(--ink)}

.btn{display:block;width:100%;background:var(--red);color:#fff;font-family:'Sora';
     font-weight:700;font-size:16px;padding:16px;border-radius:3px;transition:background .15s}
.btn:hover{background:var(--red-dp)}

/* opções */
.ops{display:flex;flex-direction:column;gap:9px;margin-bottom:28px}
.op{display:flex;align-items:flex-start;gap:13px;text-align:left;padding:15px 17px;
    border:1px solid var(--linha);border-radius:4px;background:#fff;line-height:1.45;
    transition:border-color .13s, background .13s;font-size:15.5px}
.op:hover{border-color:var(--gray-c);background:var(--papel)}
.op.on{border-color:var(--red);background:#fff;box-shadow:0 0 0 1px var(--red)}
.op .marca{width:17px;height:17px;border:1.5px solid var(--linha);border-radius:50%;
           flex:none;margin-top:3px;position:relative;transition:all .13s}
.op.on .marca{border-color:var(--red)}
.op.on .marca::after{content:"";position:absolute;inset:3px;border-radius:50%;
                     background:var(--red)}

.navs{display:flex;justify-content:space-between;align-items:center;gap:12px}
.voltar,.avancar{font-size:14px;font-weight:600;color:var(--gray);padding:8px 0}
.voltar:hover{color:var(--ink)}
.avancar{color:var(--red);font-family:'Sora';font-weight:700}

/* alinhamento */
.campos{display:flex;flex-direction:column;gap:20px;margin-bottom:30px}
.campo{display:block}
.campo > span{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;
              color:var(--dark)}
.campo input{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:3px;
             background:#fff;font-size:15px}
.campo input:focus{outline:none;border-color:var(--ink)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:9px 14px;border:1px solid var(--linha);border-radius:99px;font-size:13.5px;
      font-weight:500;background:#fff;transition:all .13s}
.pill:hover{border-color:var(--gray-c)}
.pill.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* resultado */
.res h1.dna{font-size:clamp(27px,4.6vw,40px);margin-bottom:26px}
.mix{background:var(--papel);padding:18px 20px;border-radius:4px;margin-bottom:30px}
.mixl{display:flex;align-items:center;gap:11px;padding:6px 0;font-size:14px}
.mixl .pt{width:9px;height:9px;border-radius:50%;flex:none}
.mixl .nm{width:112px;font-weight:600;flex:none}
.mixl .bar{flex:1;height:6px;background:var(--papel2);border-radius:99px;overflow:hidden}
.mixl .bar i{display:block;height:100%;border-radius:99px}
.mixl .vl{width:22px;text-align:right;font-family:'Sora';font-weight:700;
          font-variant-numeric:tabular-nums;flex:none}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:34px}
.carta{border:1px solid var(--linha);border-top:3px solid var(--red);border-radius:4px;
       padding:20px;background:#fff}
.carta.comp{border-top-color:var(--gray)}
.carta .rot{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);
            font-weight:700;margin-bottom:8px}
.carta h3{margin-bottom:10px}
.carta .fr{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:17px;
           line-height:1.44;color:var(--dark);margin-bottom:16px}
.linha{font-size:13.5px;line-height:1.5;padding:9px 0;border-top:1px solid var(--fio);
       color:var(--dark)}
.linha b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--gray);font-weight:700;margin-bottom:3px}
.linha i{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px}
.linha.alerta b{color:var(--red)}

h3.sec{margin:0 0 14px}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:34px}
.fmt{border:1px solid var(--linha);border-radius:4px;padding:16px;background:#fff}
.fmt .n{font-family:'Sora';font-weight:800;font-size:11px;color:var(--red);display:block;
        margin-bottom:7px}
.fmt b{display:block;font-family:'Sora';font-weight:700;font-size:15px;line-height:1.28;
       letter-spacing:-.018em;margin-bottom:6px}
.fmt .de{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;
         font-weight:600}

.proximo{background:var(--ink);color:var(--cream);padding:26px;border-radius:4px;
         margin-bottom:22px}
.proximo .rot{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);
              font-weight:700;margin-bottom:10px}
.proximo p{font-size:15px;line-height:1.55;color:var(--dim);margin-bottom:20px}
.proximo b{color:var(--cream);font-weight:600}
.proximo .mini{color:var(--gray)}

.refazer{display:block;margin:0 auto;font-size:13px;color:var(--gray);
         text-decoration:underline;text-underline-offset:3px}
.refazer:hover{color:var(--red)}

@media (max-width:720px){
  .duo,.fmts{grid-template-columns:1fr}
  .tela{padding:34px 18px 60px}
  .mixl .nm{width:92px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* ── plano ── */
.plano .abertura{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:19px;
  line-height:1.5;color:var(--dark);margin-bottom:24px}
.plano .abertura b{font-weight:400;color:var(--ink)}
.regra{background:var(--papel);border-left:2px solid var(--red);padding:15px 18px;
  font-size:14.5px;line-height:1.55;color:var(--dark);margin-bottom:30px}
.regra b{font-weight:600;color:var(--ink)}
.dia{border:1px solid var(--linha);border-radius:5px;padding:22px;margin-bottom:16px;
  background:#fff;break-inside:avoid}
.dia-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--fio);margin-bottom:13px;flex-wrap:wrap}
.dn{font-family:'Sora';font-weight:800;font-size:12px;color:var(--red);letter-spacing:.08em;
  margin-right:10px}
.dp{font-size:11px;color:var(--gray);letter-spacing:.12em;text-transform:uppercase;
  font-weight:600}
.dt{font-size:11px;color:var(--gray-c);letter-spacing:.06em}
.dia h3{margin-bottom:6px}
.dnota{font-size:13.5px;color:var(--gray);margin-bottom:15px}
.gancho{background:var(--ink);color:var(--cream);padding:15px 17px;border-radius:4px;
  font-family:'Newsreader',Georgia,serif;font-size:17.5px;line-height:1.45;margin-bottom:15px}
.gancho b{display:block;font-family:'Inter';font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);margin-bottom:6px;font-weight:700}
.beats{margin-bottom:16px}
.beat{display:flex;gap:13px;padding:8px 0;border-bottom:1px solid var(--fio);font-size:14px;
  line-height:1.5}
.beat:last-child{border-bottom:none}
.bt{font-family:'Sora';font-weight:700;font-size:11px;color:var(--red);width:54px;flex:none;
  padding-top:2px}
.dfim{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px;
  border-top:1px solid var(--fio);font-size:13px;line-height:1.5;color:var(--dark)}
.dfim b{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gray);margin-bottom:3px;font-weight:700}
.dfim .cuid b{color:var(--red)}
.outros{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
.outro{border:1px solid var(--linha);border-radius:4px;padding:15px;background:#fff}
.outro b{display:block;font-family:'Sora';font-weight:700;font-size:15px;margin-bottom:4px}
.outro span{font-size:10.5px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;
  font-weight:600}
.outro p{font-size:13px;color:var(--dark);margin-top:7px;line-height:1.45}
.acoes{display:flex;gap:10px;margin-top:8px}
.acoes .btn,.acoes .btn2{flex:1}
.btn2{display:block;background:none;border:1px solid var(--linha);color:var(--dark);
  font-family:'Sora';font-weight:700;font-size:15px;padding:15px;border-radius:3px;
  transition:all .15s}
.btn2:hover{border-color:var(--ink)}
@media (max-width:720px){.dfim,.outros{grid-template-columns:1fr}.acoes{flex-direction:column}}
@media print{
  .topo,.prog,.acoes,.regra:last-of-type{display:none!important}
  body{font-size:11pt} .tela{padding:0;max-width:none}
  .dia{break-inside:avoid;page-break-inside:avoid;border-color:#ccc}
  .gancho{background:#f2ece2;color:#000}
  .gancho b{color:#c40000}
}
</style>
</head>

<script>/* ── motor do plano: escolhe formatos, monta 7 dias e preenche variáveis ── */

const CTA_POR_OBJETIVO = {
  "Me mandar mensagem no direct":
    {curto:"me chama no direct", frase:"Se isso faz sentido para você, me manda uma mensagem."},
  "Agendar pelo link":
    {curto:"agenda pelo link", frase:"Se quiser resolver isso, o link para agendar está na bio."},
  "Salvar e acompanhar":
    {curto:"salva esse conteúdo", frase:"Salva esse aqui para quando você precisar."},
  "Comentar e participar":
    {curto:"comenta aqui", frase:"Me conta nos comentários como isso funciona aí com você."}
};

const SEMANA = [
  {dia:"Dia 1", papel:"Principal · alcance",  fonte:"P", nota:"Abre a semana com o formato mais confortável do seu perfil."},
  {dia:"Dia 2", papel:"Principal · autoridade", fonte:"P", nota:"Mostra competência antes de qualquer oferta."},
  {dia:"Dia 3", papel:"Complementar",  fonte:"C", nota:"Sai da zona de conforto uma vez. É o teste da semana."},
  {dia:"Dia 4", papel:"Principal · alcance", fonte:"P", nota:"Volta ao que funciona, com tema novo."},
  {dia:"Dia 5", papel:"Complementar", fonte:"C", nota:"Segunda tentativa no perfil complementar, agora com menos atrito."},
  {dia:"Dia 6", papel:"Principal · conexão ou desejo", fonte:"P", prefere:["Conexão","Desejo"],
   nota:"Aproxima antes do convite."},
  {dia:"Dia 7", papel:"Variação do melhor", fonte:"V", nota:"Repete o formato que teve melhor sinal, trocando só o tema."}
];

function preencher(txt, d){
  const mapa = {
    "{profissao}": d.profissao || "sua área",
    "{vende}":     d.vende || "o que você vende",
    "{publico}":   d.publico || "o seu público",
    "{resultado}": d.resultado || "o resultado que você entrega",
    "{acao}":      (CTA_POR_OBJETIVO[d.acao] || {}).curto || "falar com você"
  };
  return String(txt).replace(/\{(profissao|vende|publico|resultado|acao)\}/g,
    m => mapa[m] || m);
}

/* seleciona formatos: 3 do principal + 2 do complementar, respeitando recursos */
function escolherFormatos(r, d){
  const podeTela  = (d.recursos||[]).includes("Editor ou equipe") || true;
  const semAparecer = d.camera === "Mostrar processos sem aparecer";
  const curto = d.sessao === "Até 30 minutos";

  const doPerfil = id => FORMATOS.filter(f => f.perfil === id);
  const ordenar = lista => lista.slice().sort((a,b) => {
    // quem não quer aparecer: prioriza formatos sem fala direta
    const semFalaA = /tela|time-lapse|texto/i.test(a.tipo) ? 0 : 1;
    const semFalaB = /tela|time-lapse|texto/i.test(b.tipo) ? 0 : 1;
    if (semAparecer && semFalaA !== semFalaB) return semFalaA - semFalaB;
    // sessão curta: prioriza formatos mais curtos
    if (curto){
      const durA = parseInt(a.duracao) || 60, durB = parseInt(b.duracao) || 60;
      if (durA !== durB) return durA - durB;
    }
    return 0;
  });

  const P = ordenar(doPerfil(r.principal.id));
  const C = ordenar(doPerfil(r.complementar.id));
  return {principais: P.slice(0,3), complementares: C.slice(0,2), P, C};
}

/* monta os 7 dias */
function montarSemana(r, d){
  const esc = escolherFormatos(r, d);
  const cta = CTA_POR_OBJETIVO[d.acao] || CTA_POR_OBJETIVO["Salvar e acompanhar"];
  const usados = new Set();
  const pegar = (lista, prefere) => {
    // primeiro tenta a função pedida, entre os ainda não usados
    if (prefere){
      const alvo = lista.find(f => !usados.has(f.id) && prefere.includes(f.funcao));
      if (alvo){ usados.add(alvo.id); return alvo; }
    }
    const livre = lista.find(f => !usados.has(f.id));
    if (livre){ usados.add(livre.id); return livre; }
    return lista[0];   // só repete se a lista acabar
  };
  return SEMANA.map(s => {
    let f;
    if (s.fonte === "P") f = pegar(esc.P, s.prefere);
    else if (s.fonte === "C") f = pegar(esc.C, s.prefere);
    else f = esc.principais[0];   // dia 7 repete de propósito: é a variação
    return {...s, formato: f, cta, variacao: s.fonte === "V"};
  });
}

/* abertura personalizada do relatório */
function abertura(r, d){
  const p = r.principal, s = r.complementar;
  const fmts = escolherFormatos(r, d).principais.map(f => f.nome);
  const fraco = r.bruto[r.bruto.length - 1];   // perfil de menor pontuação
  return preencher(
    `Seu DNA combina <b>${p.nome}</b> e <b>${s.nome}</b>. Seu conteúdo ganha força quando ` +
    `você ${p.forca.charAt(0).toLowerCase() + p.forca.slice(1).replace(/\.$/,"")}, ` +
    `mas perde naturalidade quando tenta ${fraco.forcar}. ` +
    `Nos próximos sete dias, sua prioridade é usar <b>${fmts[0]}</b>, <b>${fmts[1]}</b> e ` +
    `<b>${fmts[2]}</b> para falar com {publico} sobre {resultado} — e conduzir essas ` +
    `pessoas a {acao}.`, d);
}

function guardar(){
  try{ localStorage.setItem(CH, JSON.stringify({respostas, dados})); }catch(e){}

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ── cálculo ── */
function calcular(){
  const c = {A:0,B:0,C:0,D:0};
  Object.values(respostas).forEach(v => { if (c[v] !== undefined) c[v]++; });
  const total = Object.values(c).reduce((a,b)=>a+b,0) || 1;
  const rank = ORDEM.slice().sort((x,y) => c[y]-c[x] || ORDEM.indexOf(x)-ORDEM.indexOf(y));
  const p = rank[0], s = rank[1];
  const soma = c[p] + c[s] || 1;
  return {
    cont: c, total,
    principal: PERFIS[p], complementar: PERFIS[s],
    pctP: Math.round(c[p]/soma*100), pctS: 100 - Math.round(c[p]/soma*100),
    bruto: ORDEM.map(k => ({...PERFIS[k], n:c[k], pct: Math.round(c[k]/total*100)}))

  };
}

  L.push("DNA DE CONTEÚDO — RESULTADO");
  L.push(`${r.pctP}% ${r.principal.nome} · ${r.pctS}% ${r.complementar.nome}`);
  L.push(`Contagem: ` + r.bruto.map(b => `${b.nome} ${b.n}`).join(" · "));
  L.push("");
  L.push("RESPOSTAS: " + Array.from({length:20}, (_,i) =>
    (respostas[i+1] || "-")).join(""));
  L.push("");
  L.push("NEGÓCIO");
  ALINHA.forEach(c => {
    let v = dados[c.k];
    if (Array.isArray(v)) v = v.join(", ");
    L.push(`${c.t}: ${v || "—"}`);
  });
  return L.join("\n");
}

function reiniciar(){
  if (!confirm("Refazer o diagnóstico do zero?")) return;
  respostas = {}; dados = {}; guardar(); ir(0);
}

function ir(n){
  passo = n;
  window.scrollTo({top:0, behavior:"instant"});
  if (n === 0) return verIntro();
  if (n >= 1 && n <= 20) return verPergunta(n);
  if (n === 21) return verAlinhamento();
  if (n === 23) return verPlano();
  return verResultado();
}

/* retoma de onde parou */
(function(){
  const feitas = Object.keys(respostas).length;
  ir(feitas === 0 ? 0 : feitas >= 20 ? 21 : feitas + 1);
})();
